green_purity = 0.70
blue_purity = 0.70

[darktable.soften]     # flame glow
size = 60.0
saturation = 90.0
brightness = 0.25
amount = 22.0

[darktable.grain]
strength = 10.0
coarseness = 1400.0

[darktable.vignette]
scale = 55.0
falloff_scale = 85.0
