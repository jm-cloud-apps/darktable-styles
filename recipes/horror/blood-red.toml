name = "Blood Red"
look = "Sin City selective color: stark high-contrast B&W where only blood reds survive"
credit = "House recipe (this repo)"

[darktable.colorequal]
threshold = 0.0        # also grey out low-saturation colors (skin)
hue_shift = -10.0      # nodes every 45°: red node onto blood red, orange node onto skin
sat_red = 2.0
sat_orange = 0.0       # skin goes grey
sat_yellow = 0.0
sat_green = 0.0
sat_cyan = 0.0
sat_blue = 0.0
sat_lavender = 0.0
sat_magenta = 0.0
hue_red = -5.0
bright_red = 0.9

[darktable.colorbalancergb]
chroma_global = -0.5   # halve everything; colorequal doubles red back
contrast = 0.32
shadows_Y = -0.08
highlights_Y = 0.05

[darktable.bilat]
detail = 0.25

[darktable.grain]
strength = 14.0
coarseness = 1500.0

[darktable.vignette]
scale = 65.0
falloff_scale = 70.0
brightness = -0.35
saturation = 0.0
autoratio = 1
