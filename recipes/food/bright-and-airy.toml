name = "Bright and Airy"
look = "Cafe and brunch: light open shadows, clean bright whites, soft pastel color with appetizing warmth, gentle glow"
credit = "House recipe (this repo)"
ec = "+1/3 to +1"

[darktable.colorbalancergb]
contrast = -0.04
shadows_Y = 0.06       # open, light shadows
highlights_Y = 0.04    # whites stay bright instead of going grey
chroma_global = -0.04
saturation_global = -0.06   # lighter, pastel colors
vibrance = 0.06
midtones_C = 0.008
midtones_H = 60.0      # a breath of warmth

[darktable.colorequal]
threshold = 0.04
sat_red = 1.04
hue_red = 2.0
sat_orange = 1.04
bright_orange = 1.04
bright_yellow = 1.04
sat_cyan = 0.90        # clean whites: no blue window-light casts
sat_blue = 0.88
sat_lavender = 0.90

[darktable.soften]     # airy glow
size = 40.0
saturation = 100.0
brightness = 0.2
amount = 8.0
